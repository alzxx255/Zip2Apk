name: Web to APK Builder

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website (contoh: https://example.com)'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: false
        default: 'MyWebApp'
        type: string
      package_id:
        description: 'Package ID (contoh: com.example.webapp)'
        required: false
        default: 'com.example.webapp'
        type: string
      version_name:
        description: 'Versi aplikasi'
        required: false
        default: '1.0.0'
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create project ${{ github.event.inputs.package_id }} "${{ github.event.inputs.app_name }}"
          cd project
          cordova platform add android

      - name: Configure WebView to Load URL
        run: |
          cd project
          # Ganti config.xml
          cat > config.xml <<EOF
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="${{ github.event.inputs.package_id }}" version="${{ github.event.inputs.version_name }}" xmlns="http://www.w3.org/ns/widgets">
              <name>${{ github.event.inputs.app_name }}</name>
              <content src="${{ github.event.inputs.web_url }}" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="*" />
              <access origin="*" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <preference name="LoadUrlTimeoutValue" value="700000" />
          </widget>
          EOF

      - name: Build APK (Debug)
        run: |
          cd project
          cordova build android

      - name: Rename APK
        run: |
          cd project/platforms/android/app/build/outputs/apk/debug/
          mv app-debug.apk ${{ github.event.inputs.app_name }}.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-apk
          path: project/platforms/android/app/build/outputs/apk/debug/*.apk
