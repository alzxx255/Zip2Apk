name: Advanced ZIP to APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      zip_filename:
        description: 'Nama file ZIP (kosongkan jika ingin auto-detect)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK from ZIP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Environment (Node, Java, Android SDK)
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      # 3. Deteksi dan Ekstrak ZIP
      - name: 📦 Find and Extract ZIP
        id: extract_zip
        run: |
          # Cari file .zip di root repo
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Tidak ada file ZIP ditemukan di root repo!"
            exit 1
          fi
          
          echo "✅ Menemukan file: $ZIP_FILE"
          echo "ZIP_NAME=$(basename $ZIP_FILE)" >> $GITHUB_OUTPUT
          
          # Buat folder www dan ekstrak
          mkdir -p www
          unzip -o "$ZIP_FILE" -d www/
          
          # Cek apakah ada folder tambahan di dalam zip (misal: project/index.html)
          # Jika ada, pindahkan isinya ke root www
          if [ -d "www/$(ls www | head -n 1)" ] && [ $(ls www | wc -l) -eq 1 ]; then
            echo "📂 Memindahkan folder utama ke root www..."
            mv www/*/* www/ 2>/dev/null || true
            rm -rf www/*/
          fi

      # 4. Install Cordova dan Build
      - name: 📱 Install Cordova
        run: npm install -g cordova

      - name: 🏗️ Create Cordova Project
        run: |
          cordova create myapp com.example.myapp MyApp
          cd myapp
          
          # Hapus www bawaan Cordova dan ganti dengan milik kita
          rm -rf www
          cp -r ../www ./www
          
          # Tambahkan platform Android
          cordova platform add android

      - name: 🔨 Build APK (Debug)
        run: |
          cd myapp
          cordova build android --debug

      # 5. Upload APK sebagai Artifact
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ github.run_number }}
          path: myapp/platforms/android/app/build/outputs/apk/debug/*.apk

      # 6. (Opsional) Buat Release Otomatis
      - name: 🚀 Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release APK v1.0.${{ github.run_number }}
          files: myapp/platforms/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
