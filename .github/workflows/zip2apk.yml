name: Build Android Flutter

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag untuk release (misal: v1.0.0)'
        required: false
        default: ''
        type: string
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - profile
      chat_id:
        description: 'Telegram chat ID untuk notifikasi'
        required: false
        default: ''
        type: string
      message_id:
        description: 'Telegram message ID (untuk edit pesan)'
        required: false
        default: ''
        type: string
      file_name:
        description: 'Nama file output (tanpa ekstensi)'
        required: false
        default: 'app'
        type: string

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "✅ Keystore decoded"
          else
            echo "⚠️ KEYSTORE_BASE64 not set"
          fi

      - name: Create key.properties
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF
          fi

      - name: Set build mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.build_mode || 'release' }}"
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Build mode: $MODE"

      - name: Build APK
        run: |
          flutter build apk --${{ steps.mode.outputs.mode }} \
            --split-per-abi \
            --no-tree-shake-icons \
            ${{ steps.mode.outputs.mode == 'release' && '--obfuscate --split-debug-info=build/debug-info' || '' }}

      - name: Build Universal APK
        run: flutter build apk --${{ steps.mode.outputs.mode }} --no-tree-shake-icons

      - name: Build AAB
        if: steps.mode.outputs.mode == 'release'
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Rename outputs
        id: rename
        run: |
          FILE_NAME="${{ github.event.inputs.file_name || 'app' }}"
          TAG_NAME="${{ github.event.inputs.tag || github.sha }}"
          
          cd build/app/outputs/flutter-apk/
          for file in app-*-release.apk; do
            [ -f "$file" ] && abi=$(echo "$file" | sed 's/app-\(.*\)-release.apk/\1/') && \
              mv "$file" "${FILE_NAME}-${abi}-${TAG_NAME}.apk"
          done
          [ -f app-release.apk ] && mv app-release.apk "${FILE_NAME}-universal-${TAG_NAME}.apk" || true
          
          cd ../../bundle/release/ 2>/dev/null || cd - >/dev/null
          [ -f app-release.aab ] && mv app-release.aab "${FILE_NAME}-${TAG_NAME}.aab" || true
          
          ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.event.inputs.tag || github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload AAB
        if: steps.mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.event.inputs.tag || github.sha }}
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ github.event.inputs.tag || github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | \`${{ steps.mode.outputs.mode }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| File | \`${{ github.event.inputs.file_name || 'app' }}\` |" >> $GITHUB_STEP_SUMMARY

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ github.event.inputs.tag || github.sha }}
          path: ./release-apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ github.event.inputs.tag || github.sha }}
          path: ./release-aab
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./release-apk/*.apk
            ./release-aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [analyze-and-test, build-android]
    if: always() && (github.event.inputs.chat_id != '' || secrets.TELEGRAM_CHAT_ID != '')

    steps:
      - name: Send Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_id: ${{ github.event.inputs.message_id }}
          message: |
            ${{ needs.build-android.result == 'success' && '✅ Build BERHASIL' || '❌ Build GAGAL' }}
            
            📦 Repo: ${{ github.repository }}
            🏷️ Tag: ${{ github.event.inputs.tag || github.ref_name }}
            🔧 Mode: ${{ github.event.inputs.build_mode || 'release' }}
            📁 File: ${{ github.event.inputs.file_name || 'app' }}
            
            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
