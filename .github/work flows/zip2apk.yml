name: ZIP to APK Builder

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL file ZIP (direct link)'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: false
        default: 'MyApp'
        type: string
      package_id:
        description: 'Package ID (contoh: com.example.app)'
        required: false
        default: 'com.example.myapp'
        type: string
  push:
    paths:
      - '*.zip'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Download ZIP
        run: |
          mkdir -p source
          if [ -n "${{ github.event.inputs.zip_url }}" ]; then
            wget -O source/app.zip "${{ github.event.inputs.zip_url }}"
          else
            cp *.zip source/app.zip
          fi

      - name: Extract ZIP
        run: |
          mkdir -p web
          unzip -o source/app.zip -d web

      - name: Create Cordova Project
        run: |
          cordova create project ${{ github.event.inputs.package_id || 'com.example.myapp' }} "${{ github.event.inputs.app_name || 'MyApp' }}"
          rm -rf project/www/*
          cp -r web/* project/www/ || true

      - name: Add Android Platform
        working-directory: project
        run: cordova platform add android

      - name: Build APK (Debug)
        working-directory: project
        run: cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: project/platforms/android/app/build/outputs/apk/debug/*.apk
